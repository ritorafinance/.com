.sidebar{
position:fixed;

.logout{

.overlay{

left:0;

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
addDoc,
collection,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyA3bj3QMqH9fxda8ixe66dSlW-Kb8mD8hk",
authDomain:"rfg-finance.firebaseapp.com",
projectId:"rfg-finance",
storageBucket:"rfg-finance.firebasestorage.app",
messagingSenderId:"600995823489",
appId:"1:600995823489:web:1a4449f074d14eca05f280"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let soldeUtilisateur = 0;
let deviseUtilisateur = "";

/* MENU */
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");
const menuBtn=document.getElementById("menuBtn");

menuBtn.onclick=()=>{
sidebar.classList.add("active");
overlay.classList.add("active");
};

overlay.onclick=()=>{
sidebar.classList.remove("active");
overlay.classList.remove("active");
};

/* CHARGEMENT USER */
onAuthStateChanged(auth, async (user)=>{

if(!user){
window.location.replace("connecter.html");
return;
}

const ref = doc(db,"utilisateurs",user.uid);
const snap = await getDoc(ref);

if(!snap.exists()) return;

const data = snap.data();

soldeUtilisateur = Number(data.solde || 0);
deviseUtilisateur = data.devise || "EUR";

document.getElementById("profileName").textContent =
data.prenom + " " + data.nom;

document.getElementById("accountNumber").textContent =
t.account + " : " + (data.numeroCompte || "");

document.getElementById("numeroCompte").value =
data.numeroCompte || "";

document.getElementById("menuSolde").textContent =
soldeUtilisateur.toLocaleString("fr-FR") + " " + deviseUtilisateur;

});

let traitementEnCours = false;

/* TRANSFERT */
document.getElementById("btnTransfert").addEventListener("click", async ()=>{

if(traitementEnCours) return;
traitementEnCours = true;

const montant = Number(document.getElementById("montant").value);
const iban = document.getElementById("iban").value.trim();
const bic = document.getElementById("bic").value.trim();
const beneficiaire = document.getElementById("beneficiaire").value.trim();
const date = document.getElementById("dateExecution").value;
const motif = document.getElementById("motif").value.trim();
const validation = document.getElementById("validation").checked;

if(!montant || montant <= 0) return alert("Montant invalide");
if(montant > soldeUtilisateur) return alert("Solde insuffisant");
if(!iban || !bic || !beneficiaire || !date || !motif || !validation)
return alert("Tous les champs sont obligatoires");

const user = auth.currentUser;
if(!user) return;

/* ID */
const transactionId = "TR-" + Date.now();

try{

/* ❗ ON NE DÉBITE PLUS LE SOLDE ICI */

/* HISTORIQUE GLOBAL */

/* COLLECTION TRANSFERTS */
const transfertRef = await addDoc(collection(db,"transferts"),{
    uid:user.uid,
    transactionId,
    montant,
    devise: deviseUtilisateur,   // <-- ajouter cette ligne
    iban,
    bic,
    beneficiaire,
    dateExecution:date,
    motif,
    statut:"EN ATTENTE",
    createdAt:serverTimestamp()
});

window.location.href = "encour.html?id=" + transfertRef.id;

}catch(e){

traitementEnCours = false;

console.error(e);
alert("Erreur transfert : " + e);

}

});

/* LOGOUT */
document.getElementById("logoutBtn").addEventListener("click", async ()=>{
await signOut(auth);
window.location.replace("connecter.html");
});
</script>
