<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

body{background:#f2f3f7;}

.topbar{
height:70px;
background:#0b76d1;

align-items:center;
padding:0 20px;

font-size:20px;
font-weight:500;
}

.container{
max-width:850px;

padding:15px;
}

.progress-wrapper{
width:100%;
height:30px;
background:#ececec;
border-radius:4px;
overflow:hidden;
}

.progress-bar{
width:0%;
height:100%;
background:#00c853;
transition:width .3s;
}

.status,.percent{
text-align:center;
margin-top:10px;
font-size:16px;
font-weight:600;
color:#d32f2f;
}

.card{
margin-top:20px;
background:white;
border:1px solid #ddd;
}

.card-header{
padding:15px;
text-align:center;
font-weight:600;
border-bottom:1px solid #ddd;
}

.card-body{
padding:15px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin-top:10px;
font-size:16px;
border:1px solid #ccc;
border-radius:4px;
}

.hidden{display:none;}

#stepBox{
margin-top:15px;
padding:10px;
background:#fff8e1;
border:1px solid #ffd54f;
}

.buttons{
display:flex;
gap:10px;
margin-top:10px;
}

.btn{
flex:1;
padding:12px;
border:none;
cursor:pointer;
}

.btn-primary{background:#0b76d1;color:white;}
.btn-warning{background:#f4b400;color:white;}

.home-btn{
display:none;
width:100%;
margin-top:15px;
padding:14px;

<div class="buttons">

<button class="btn btn-warning" id="cancelBtn">

</div>
</div>

</div>

</div>

<button class="home-btn" id="homeBtn">

document.getElementById("confirmBtn").textContent = t.confirm;

document.getElementById("homeBtn").textContent = t.home;

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  deleteDoc,
  collection,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyA3bj3QMqH9fxda8ixe66dSlW-Kb8mD8hk",
  authDomain: "rfg-finance.firebaseapp.com",
  projectId: "rfg-finance",
  storageBucket: "rfg-finance.firebasestorage.app",
  messagingSenderId: "600995823489",
  appId: "1:600995823489:web:1a4449f074d14eca05f280"
});

const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(location.search);
const transfertId = params.get("id");

let uid = null;
let progress = 0;
let phase = 1;
let paused = false;

/* UI */
const progressBar = document.getElementById("progressBar");
const percentText = document.getElementById("percentText");
const statusText = document.getElementById("statusText");

const stepBox = document.getElementById("stepBox");
const stepMessage = document.getElementById("stepMessage");

const confirmBtn = document.getElementById("confirmBtn");
const cancelBtn = document.getElementById("cancelBtn");
const homeBtn = document.getElementById("homeBtn");

/* AUTH */
onAuthStateChanged(auth, (user) => {
  if (user) uid = user.uid;
});

/* MESSAGE UNIQUE */
const MESSAGE = t.activationMessage;
/* UPDATE TRANSFERT */
async function updateTransfer(status) {
  if (!transfertId) return;
  await updateDoc(doc(db, "transferts", transfertId), {
    statut: status,
    updatedAt: serverTimestamp()
  });
}

/* HISTORY */

/* LOOP */
const timer = setInterval(async () => {
  if (paused) return;

  progress++;
  if (progress > 100) progress = 100;

  progressBar.style.width = progress + "%";
  percentText.textContent = progress + "%";

  /* 40% */
  if (progress === 40 && phase === 1) {
    paused = true;
    stepBox.classList.remove("hidden");
    stepMessage.textContent = MESSAGE;
  }

  /* 85% */
  if (progress === 85 && phase === 2) {
    paused = true;
    stepBox.classList.remove("hidden");
    stepMessage.textContent = MESSAGE;
  }

  /* 100% → DÉBIT UNIQUEMENT ICI */
  if (progress >= 100) {
    clearInterval(timer);

    statusText.textContent = t.finished;
    stepBox.classList.add("hidden");

    document.querySelector(".card-body").innerHTML = `
<p>${t.finishedMessage}</p>
<p>${t.waitMessage}</p>
<p>${t.thanks}</p>
`;

    homeBtn.style.display = "block";

    try {
      console.log("transfertId =", transfertId);
      const ref = doc(db, "transferts", transfertId);
      const snap = await getDoc(ref);
      console.log("Document trouvé :", snap.exists());

if (snap.exists()) {
  console.log(snap.data());
}

      if (snap.exists()) {
        const data = snap.data();
        console.log("Données du transfert :", data);
        const montant = Number(data.montant || 0);
        const userId = data.uid;

        await updateTransfer("EN ATTENTE");
        await addDoc(collection(db,"historique"),{
  uid: userId,
  type: "TRANSFERT",
  transactionId: data.transactionId,
  montant: data.montant,
  devise: data.devise || deviseUtilisateur,
  iban: data.iban,
  bic: data.bic,
  beneficiaire: data.beneficiaire,
  dateExecution: data.dateExecution,
  motif: data.motif,
  type: t.transfer,
  statut: t.pending,
  date: serverTimestamp()
});
      }
    } catch (e) {
      console.error(e);
    }
  }
}, 120);

/* CONFIRM */
confirmBtn.onclick = () => {
  const code = document.getElementById("virementCode").value.trim();

  if (phase === 1 && code === "6166") {
    phase = 2;
    paused = false;
    stepBox.classList.add("hidden");
  } 
  else if (phase === 2 && code === "9541") {
    phase = 3;
    paused = false;
    stepBox.classList.add("hidden");
  }
};

/* CANCEL */
cancelBtn.onclick = async () => {
  clearInterval(timer);

  try {
    if (transfertId) {
      await deleteDoc(doc(db, "transferts", transfertId));
    }
  } catch (e) {
    console.error(e);
  }

  location.href = "dashboard.html";
};

/* HOME */
homeBtn.onclick = () => {
  location.href = "dashboard.html";
};
